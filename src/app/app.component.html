<ion-app>
  <ion-router-outlet></ion-router-outlet>
  <app-loading-overlay
    [visible]="loading$ | async"
    [message]="message$ | async"
  ></app-loading-overlay>
  <app-error-modal
    [isOpen]="errorOpen$ | async"
    [message]="(error$ | async) ?? ''"
    (acknowledged)="clearError()"
  ></app-error-modal>
</ion-app>
