<ion-modal [isOpen]="isOpen" (didDismiss)="onDismiss()">
  <ng-template>
    <div class="modal-wrapper">
      <app-board width="medium">
        <div class="modal-content">
          <h2>{{ isEditMode ? 'Editar Tarea' : 'Nueva Tarea' }}</h2>
          
          <div class="form-container">
            <div class="input-group">
              <label>Nombre de la Tarea</label>
              <input type="text" [(ngModel)]="taskName" placeholder="Ej. Estudiar inglés" maxlength="40">
            </div>

            <div class="input-group">
              <label>Categoría</label>
              <select [(ngModel)]="selectedCategoryId">
                @for (category of categories; track category.id) {
                  <option [value]="category.id">{{ category.name }}</option>
                }
              </select>
            </div>

            <div class="input-group">
              <label>Frecuencia</label>
              <select [(ngModel)]="taskFrequency">
                @for (freq of frequencies; track freq.value) {
                  <option [value]="freq.value">{{ freq.label }}</option>
                }
              </select>
            </div>

            @if (taskFrequency != TaskFrequency.No_repeat) {
              <div class="input-group">
                <label>Intervalo</label>
                <div class="interval-input">
                  <span>Repetir cada</span>
                  <input type="number" [(ngModel)]="taskInterval" min="1" max="365">
                  <span>{{ getIntervalLabel() }}</span>
                </div>
              </div>
            }

            <div class="input-group">
              <label>Esfuerzo (Determina el coste)</label>
              <select [(ngModel)]="taskEffort">
                @for (effort of efforts; track effort.value) {
                  <option [value]="effort.value">{{ effort.label }}</option>
                }
              </select>
            </div>

            <div class="input-group">
              <label>Fecha límite</label>
              <input type="date" [(ngModel)]="taskDueDate" class="date-input">
            </div>
          </div>

          <div class="modal-actions">
            <app-button type="medium" [fill]="false" (handleClick)="onDismiss()" [disabled]="isSubmitting">
              Cancelar
            </app-button>
            
            <app-button type="gem" (handleClick)="onSubmit()" [disabled]="isSubmitting || !taskName.trim() || selectedCategoryId === null">
              {{ isEditMode ? 'Guardar' : 'Crear' }}
            </app-button>
          </div>
        </div>
      </app-board>
    </div>
  </ng-template>
</ion-modal>
