<ion-content [fullscreen]="true"> <div class="shop-wall ion-padding">
    <app-title-sign title="Tienda"></app-title-sign>

    <app-gem-counter [amount]="playerCoins"></app-gem-counter>

    @if (isLoading) {
      <div class="loading-container">
        <ion-spinner name="crescent"></ion-spinner>
      </div>
    } @else if (unownedCollections.length === 0) {
      <p class="empty-text">¡Enhorabuena, ya tienes todas las colecciones!</p>
    } @else {
      <div class="shop-list">
        @for (collection of unownedCollections; track collection.id) {
          <div class="shop-card">
            <h3 class="collection-name">{{ collection.name }}</h3>

            <div class="collection-grid">
              @for (item of collection.items; track item.id) {
                <div class="grid-slot" [style.--mask]="'url(' + itemImagePath(item.imageName) + ')'">
                  <img [src]="itemImagePath(item.imageName)" [alt]="item.name" />
                </div>
              }
            </div>
            
            <div class="shop-action">
              <app-button 
                [type]="playerCoins < collection.price ? 'danger' : 'gem'" 
                (handleClick)="openBuyModal(collection)"
                [disabled]="playerCoins < collection.price"
                btnClass="btn-shop"
              >
                <div class="btn-content">
                  Comprar: {{ collection.price }}
                  <img src="/assets/icons/gems-icon.png" alt="Gema" class="gem-icon-button" />
                </div>
              </app-button>
            </div>
          </div>
        }
      </div>
    }
  </div> <app-shop-buy-modal
    [isOpen]="isModalOpen"
    [collection]="selectedCollection"
    [isBuying]="isBuying"
    [playerCoins]="playerCoins"
    (dismissed)="onModalDismissed()"
    (confirmPurchase)="handlePurchase($event)"
  ></app-shop-buy-modal>

</ion-content>
